name: Generic System Image Builder

on:
  workflow_dispatch:

env:
  ROM_LINK: "https://downloads.sourceforge.net/project/kevios12a40roms/RELEASE/evolution_a40-ota-rq3a.210905.001-09191220-unofficial-unsigned.zip"
  ROM_TYPE: Generic

  BUILD_AB: "true"
  BUILD_AONLY: "false"

  ROM_AB: AB.7z
  ROM_AONLY: A.7z

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          docker image prune -af || true

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo apt-get update

          sudo apt-get purge -y \
            firefox \
            powershell \
            azure-cli || true

          sudo apt-get autoremove -y
          sudo apt-get clean

          echo "Disk usage:"
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            p7zip-full \
            openjdk-17-jdk

      - name: Clone ErfanGSIs
        run: |
          git clone --recursive https://github.com/ping2109/ErfanGSIs-TrebleExp.git ErfanGSIs

      - name: Setup ErfanGSIs
        working-directory: ErfanGSIs
        run: |
          chmod +x setup.sh
          sudo bash setup.sh

      ###########################################################
      # A-ONLY
      ###########################################################

      - name: Build A-Only GSI
        if: env.BUILD_AONLY == 'true'
        run: |
          sudo ./ErfanGSIs/url2GSI.sh \
            -a \
            "$ROM_LINK" \
            "$ROM_TYPE" \
            -d

      - name: Compress A-Only
        if: env.BUILD_AONLY == 'true'
        run: |
          7z a "$ROM_AONLY" ./ErfanGSIs/output/*

      - name: Upload A-Only
        if: env.BUILD_AONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: A-Only-GSI
          path: ${{ env.ROM_AONLY }}

      ###########################################################
      # CLEAN
      ###########################################################

      - name: Clean output
        if: env.BUILD_AB == 'true'
        run: |
          sudo rm -rf ./ErfanGSIs/output/*

      ###########################################################
      # A/B
      ###########################################################

      - name: Build A/B GSI
        if: env.BUILD_AB == 'true'
        run: |
          sudo ./ErfanGSIs/url2GSI.sh \
            -b \
            "$ROM_LINK" \
            "$ROM_TYPE" \
            -d

      - name: Compress A/B
        if: env.BUILD_AB == 'true'
        run: |
          7z a "$ROM_AB" ./ErfanGSIs/output/*

      - name: Upload A/B
        if: env.BUILD_AB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AB-GSI
          path: ${{ env.ROM_AB }}

      - name: Disk usage
        if: always()
        run: df -h
