name: Compilar PixelOS GSI (Optimizado)

on:
  workflow_dispatch: # Permite iniciar la compilación manualmente desde GitHub Actions

jobs:
  build-rom:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 🧹 Maximizar espacio de compilación (Ajustado)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096 # Reducido para ahorrar espacio crítico en disco
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 📂 Clonar repositorio propio (Patches, mk, scripts)
        uses: actions/checkout@v4
        with:
          path: mi_repo

      - name: 📦 Instalar dependencias requeridas
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 ccache 7zip bc coreutils rsync

      - name: 🔧 Configurar herramienta Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: 👤 Configurar identidad de Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: 🚀 Inicializar repositorio de PixelOS
        run: |
          mkdir PixelOS
          cd PixelOS
          repo init -u https://github.com/PixelOS-AOSP/manifest.git -b fifteen --git-lfs

      - name: 🧬 Clonar Manifest Local (Treble)
        run: |
          cd PixelOS
          git clone https://github.com/fuckyouandroid/treble_manifest.git .repo/local_manifests -b 15

      - name: 🔄 Sincronizar código fuente (Límite de hilos para RAM)
        run: |
          cd PixelOS
          repo sync --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j4

      - name: 🗑️ Limpieza post-sync para liberar espacio
        run: |
          cd PixelOS
          # Eliminar herramientas internas de repo y metadatos secundarios no requeridos para la compilación directa
          rm -rf .repo/repo
          rm -rf .repo/projects/*.git

      - name: 🔑 Generar llaves para firmar la ROM
        run: |
          cd PixelOS
          subject='/C=US/ST=State/L=City/O=Android/OU=Android/CN=Android/emailAddress=email@example.com'
          mkdir -p vendor/aosp/signing/keys
          for x in releasekey platform shared media networkstack verity otakey testkey sdk_sandbox bluetooth nfc; do \
            ./development/tools/make_key vendor/aosp/signing/keys/$x "$subject"; \
          done

      - name: 🩹 Aplicar parches
        run: |
          cd PixelOS
          cp -r ../mi_repo/patches .
          bash patches/apply-patches.sh .

      - name: 📜 Generar Makefile de la ROM
        run: |
          cd PixelOS
          cp ../mi_repo/pixel.mk device/phh/treble/
          cd device/phh/treble
          bash generate.sh pixel

      - name: ⚡ Configurar Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: 🏗️ Compilar Imagen del Sistema (Límite estricto de recursos)
        run: |
          cd PixelOS
          export USE_CCACHE=1
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=8G # Ajustado al límite real y útil del almacenamiento de caché de GitHub
          ccache -M 8G -F 0
          
          source build/envsetup.sh
          lunch treble_arm64_bN-ap2a-userdebug
          make systemimage -j4 # Reducido a 4 hilos para mitigar errores por falta de memoria RAM (OOM)

      - name: 🗜️ Crear variante VNDK Lite
        run: |
          cd PixelOS
          cp out/target/product/tdgsi_arm64_ab/system.img treble_adapter/
          cd treble_adapter
          sudo bash lite-adapter.sh 64 system.img

      - name: 🗜️ Comprimir Imagen del Sistema con 7zz
        run: |
          cd PixelOS/out/target/product/tdgsi_arm64_ab
          7zz a system.img.xz "system.img"

      - name: 📤 Subir Imagen Compilada
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-GSI-Optimized
          path: PixelOS/out/target/product/tdgsi_arm64_ab/system.img.xz
          retention-days: 5
